apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: fraud-spark
  namespace: default
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: fraud-spark:v3
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///app/spark_processor.py
  sparkVersion: "3.5.1"
  timeToLiveSeconds: 300

  restartPolicy:
    type: Never

  sparkConf:
    "spark.dynamicAllocation.enabled": "true"
    "spark.dynamicAllocation.shuffleTracking.enabled": "true"
    "spark.dynamicAllocation.minExecutors": "1"
    "spark.dynamicAllocation.initialExecutors": "1"
    "spark.dynamicAllocation.maxExecutors": "3"

    "spark.dynamicAllocation.schedulerBacklogTimeout": "15s"
    "spark.dynamicAllocation.sustainedSchedulerBacklogTimeout": "15s"
    "spark.dynamicAllocation.executorIdleTimeout": "20s"
    "spark.dynamicAllocation.executorAllocationRatio": "0.5"


    "spark.sql.shuffle.partitions": "6"
    "spark.hadoop.fs.s3a.endpoint": "s3.ap-south-1.amazonaws.com"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.path.style.access": "false"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    #"spark.sql.streaming.checkpointFileManagerClass": "org.apache.spark.internal.io.cloud.AbortableStreamBasedCheckpointFileManager"

  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark
    env:
      - name: KAFKA_BOOTSTRAP_SERVERS
        value: "host.minikube.internal:29092"
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: aws-creds
            key: access-key
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: aws-creds
            key: secret-key
      - name: AWS_DEFAULT_REGION
        value: "ap-south-1"

  executor:
    cores: 1
    memory: "512m"
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: aws-creds
            key: access-key
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: aws-creds
            key: secret-key
      - name: AWS_DEFAULT_REGION
        value: "ap-south-1"